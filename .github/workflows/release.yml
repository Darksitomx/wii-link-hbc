name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build Wii package
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2
          make package
          python3 tests/validate_package.py
          sha256sum wiilink-patcher-wii-*.zip wiilink-patcher-wii.dol > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: WiiLink Patcher Wii ${{ github.ref_name }}
          body: |
            Unofficial native Wii client created by Darksito and Mila Soraki,
            based on LibreShop and the WiiLink Patcher GUI workflow. This project
            is not affiliated with or endorsed by WiiLink.

            Highlights:
            - Minimal ZIP containing only `wiilink-patcher-wii/{boot.dol,icon.png,meta.xml}`
            - USB storage under `usb:/`
            - Streaming NUS, AES, BSDIFF, and WAD generation
            - Persistent debug and crash logs
            - Spanish and English interface selector
            - Wii Remote, Classic Controller, and GameCube Controller support

            The application does not install WAD files automatically. Verify the
            console region and keep a NAND/BootMii backup before installing WADs.
          files: |
            wiilink-patcher-wii-*.zip
            wiilink-patcher-wii.dol
            SHA256SUMS.txt
