name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install devkitPro and Wii dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/share/keyring
          sudo wget -q -U "dkp apt" \
            -O /usr/share/keyring/devkitpro-pub.gpg \
            https://apt.devkitpro.org/devkitpro-pub.gpg
          echo "deb [signed-by=/usr/share/keyring/devkitpro-pub.gpg] https://apt.devkitpro.org stable main" \
            | sudo tee /etc/apt/sources.list.d/devkitpro.list >/dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y devkitpro-pacman
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --needed --noconfirm wii-dev ppc-bzip2

      - name: Build Wii package
        shell: bash
        run: |
          set -euo pipefail
          source /etc/profile.d/devkit-env.sh
          make clean
          make -j2
          make package
          sha256sum wiilink-patcher-wii-*.zip wiilink-patcher-wii.dol > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Native Wii client based on LibreShop and the WiiLink Patcher GUI workflow.

          Highlights:
          - USB storage under `usb:/`
          - Streaming NUS, AES, BSDIFF, and WAD generation
          - Persistent debug and crash logs
          - Spanish and English interface selector
          - Wii Remote, Classic Controller, and GameCube Controller support

          The application does not install WAD files automatically. Verify the console
          region and keep a NAND/BootMii backup before installing generated WAD files.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            wiilink-patcher-wii-*.zip \
            wiilink-patcher-wii.dol \
            SHA256SUMS.txt \
            --title "WiiLink Patcher Wii $GITHUB_REF_NAME" \
            --notes-file release-notes.md
